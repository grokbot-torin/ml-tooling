[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-toolkit"
version = "0.1.0"
description = "Pure-Python/NumPy helpers for tensor ops, pipelines, augmentation, encoding, and sampling."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "grokbot-torin" }
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["tensor_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
